name: Build Android Release

# Manually builds a signed release AAB (Google Play) and a signed release
# APK (Iranian stores such as Cafe Bazaar and Myket), then attaches both
# files to a GitHub Release for the tag supplied when the workflow is run.
#
# This workflow is intentionally manual-only. Pushing a tag does not start
# a build. To publish a new version, run the workflow from GitHub Actions
# and enter the desired release tag (for example, 1.2.3). If the tag does
# not already exist, the release action creates it at the commit/ref chosen
# for the manual run. If the tag already exists, the build checks out that
# tag so rebuilt assets match the tagged source.
#
# To replace an existing release for the same tag, run the workflow with
# "Replace existing release" enabled. The existing GitHub Release is
# deleted and recreated, but the git tag is not deleted or moved.
#
# The android/ platform folder is committed, so the workflow syncs the
# web bundle into it with `cap sync` rather than regenerating the
# platform. The signing keystore is decoded from the
# ANDROID_KEYSTORE_BASE64 repository secret; the other three secrets
# (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
# are exported to the Gradle build through environment variables.
#
# The signing secrets are mapped into job-level env variables because
# the `secrets` context cannot be referenced directly in `if:`
# conditions (GitHub Actions limitation).
#
# The pinned action majors are the current releases (checkout@v7,
# setup-node@v7, setup-java@v5, upload-artifact@v7). The older v4
# majors ran on the deprecated Node 20 action runtime, whose support
# cutoff passed on June 2, 2026.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, for example 1.2.3'
        required: true
        type: string
      replace_existing_release:
        description: 'Delete and recreate the GitHub Release if this tag already has one'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: android-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag and source revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"

          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Release tag '${TAG}' is not supported. Use a simple tag such as 1.2.3 or v1.2.3; spaces, slashes, and shell metacharacters are intentionally rejected."
            exit 1
          fi

          git check-ref-format "refs/tags/${TAG}"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; building the tagged source."
            git checkout --detach "refs/tags/${TAG}"
            TARGET_COMMITISH="$(git rev-list -n 1 "refs/tags/${TAG}")"
            TAG_ALREADY_EXISTS=true
          else
            echo "Tag ${TAG} does not exist; building the manually selected workflow ref ${GITHUB_SHA}."
            git checkout --detach "${GITHUB_SHA}"
            TARGET_COMMITISH="${GITHUB_SHA}"
            TAG_ALREADY_EXISTS=false
          fi

          RELEASE_ALREADY_EXISTS=false
          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_ALREADY_EXISTS=true
            if [[ "${REPLACE_EXISTING_RELEASE}" != "true" ]]; then
              echo "::error::A GitHub Release already exists for tag ${TAG}. Re-run this workflow with 'Replace existing release' enabled to replace it."
              exit 1
            fi
            echo "A GitHub Release already exists for ${TAG}; it will be deleted and recreated after the build succeeds."
          fi

          {
            echo "target_commitish=${TARGET_COMMITISH}"
            echo "tag_already_exists=${TAG_ALREADY_EXISTS}"
            echo "release_already_exists=${RELEASE_ALREADY_EXISTS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Must stay in sync with "engines.node" in package.json
          # (>=22). Capacitor 8's CLI requires Node 22+.
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run the full CI gate
        # The repo's own release gate (lint, CSS lint, format check, and
        # the 1076-test suite). Store builds are long-lived, so an
        # engine regression must never ship inside an APK; ~30s here is
        # cheap next to the multi-minute Gradle build.
        run: npm run test:full

      - name: Sync web assets into www/ and the Android project
        run: |
          npm run sync:web
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Required by Capacitor 8 and AGP 8.13 (this project pins
          # com.android.tools.build:gradle:8.13.0).
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Fail early if release signing secrets are missing
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '' }}
        run: |
          echo "::error::Release signing secrets are not configured or incomplete. Add all four repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see the README's Android APK Builds section)."
          exit 1

      - name: Decode the release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/darya-release.jks

      - name: Stamp the app version from the release tag
        # The committed build.gradle ships versionCode 123 / versionName
        # "1.2.3"; make the build report the requested release tag
        # (1.2.3 -> versionName "1.2.3", versionCode 123) so releases
        # are self-describing and versionCode keeps increasing across tags.
        run: |
          TAG="${RELEASE_TAG}"
          VERCODE="$(printf '%s' "${TAG}" | tr -cd '0-9')"
          VERCODE="${VERCODE:-1}"
          # Anchor to line starts so comments mentioning the version are
          # never rewritten, only the real versionCode/versionName lines.
          sed -i -E \
            -e "s/^([[:space:]]*)versionCode [0-9]+/\1versionCode ${VERCODE}/" \
            -e "s/^([[:space:]]*)versionName \".*\"/\1versionName \"${TAG}\"/" \
            android/app/build.gradle

      - name: Build signed release AAB and APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/darya-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Rename release artifacts with the version tag
        # Gradle names the outputs after the app module (app-release.apk,
        # app-release.aab), so without a rename every release would ship
        # identically named assets and a new download would overwrite an
        # older version's file. Copy them under tag-qualified names (e.g.
        # darya-1.2.3-release.apk) for the GitHub Release instead.
        run: |
          TAG="${RELEASE_TAG}"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "android/app/build/outputs/bundle/release/darya-${TAG}-release.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/darya-${TAG}-release.apk"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darya-${{ env.RELEASE_TAG }}-release-files
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/darya-${{ env.RELEASE_TAG }}-release.aab
            android/app/build/outputs/apk/release/darya-${{ env.RELEASE_TAG }}-release.apk

      - name: Delete existing GitHub Release before replacement
        if: ${{ inputs.replace_existing_release && steps.release.outputs.release_already_exists == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes

      - name: Create GitHub Release and attach release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Darya ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.release.outputs.target_commitish }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/bundle/release/darya-${{ env.RELEASE_TAG }}-release.aab
            android/app/build/outputs/apk/release/darya-${{ env.RELEASE_TAG }}-release.apk
